<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SolveCount</title>
  <meta name="description" content="Count every question you solve. Snap proof, watch your study trail grow. Works offline.">
  <meta name="theme-color" content="#0d0b22">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SolveCount">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="./poppins-Bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="./core.css">
  <link rel="stylesheet" href="./glass.css">
  <link rel="stylesheet" href="./components.css">
  <link rel="stylesheet" href="./animations.css">
  <link rel="stylesheet" href="./timer.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div id="splash" class="splash" aria-hidden="true"><span>SolveCount</span></div>

  <div id="app" class="app">
    <main id="views">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-history" hidden></section>
      <section class="view" id="view-stats" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>
  <nav id="tabbar" class="tabbar glass" aria-label="Main"></nav>

  <div id="overlays"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fx" aria-hidden="true"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">SolveCount needs JavaScript to run.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
